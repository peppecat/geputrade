# Weekly dependency updates, grouped so each ecosystem arrives as one pull request.
# Security updates still open immediately. CI runs on Node 24 (npm 11), the same npm Dependabot
# uses to write package-lock.json, so its lock files pass `npm ci`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # v5 renames the series API (addCandlestickSeries and friends) and ships ESM that
      # CRA's Jest cannot parse. Migrate deliberately, then drop this ignore.
      - dependency-name: lightweight-charts
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
